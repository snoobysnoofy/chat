<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Message Test</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1a1a1a;
            color: white;
        }
        .container {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
        }
        input {
            background-color: #3a3a3a;
            color: white;
            width: 200px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .log {
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #17a2b8; }
    </style>
</head>
<body>
    <h1>Real-time Message Test</h1>
    
    <div class="container">
        <h3>Login as Alice</h3>
        <p>This will connect Alice to the socket to receive real-time messages</p>
        <button onclick="loginAsAlice()">Login as Alice</button>
        <span id="aliceStatus">Not connected</span>
    </div>

    <div class="container">
        <h3>Send Message as Charlie</h3>
        <p>This will simulate Charlie sending a message to Alice</p>
        <button onclick="sendMessageAsCharlie()">Send Message from Charlie to Alice</button>
    </div>

    <div class="container">
        <h3>Events Log</h3>
        <div id="log" class="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        let socket = null;
        let aliceToken = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function loginAsAlice() {
            try {
                // Login Alice
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'alice_test',
                        password: 'password123'
                    })
                });

                const data = await response.json();
                if (data.token) {
                    aliceToken = data.token;
                    log('Alice logged in successfully', 'success');
                    
                    // Connect to socket
                    connectSocket(aliceToken);
                } else {
                    log('Login failed: ' + JSON.stringify(data), 'error');
                }
            } catch (error) {
                log('Login error: ' + error.message, 'error');
            }
        }

        function connectSocket(token) {
            if (socket) {
                socket.disconnect();
            }

            socket = io('http://localhost:5000', {
                auth: {
                    token: token
                }
            });

            socket.on('connect', () => {
                log('Socket connected as Alice', 'success');
                document.getElementById('aliceStatus').innerText = 'Connected';
                document.getElementById('aliceStatus').style.color = '#28a745';
            });

            socket.on('disconnect', () => {
                log('Socket disconnected', 'error');
                document.getElementById('aliceStatus').innerText = 'Disconnected';
                document.getElementById('aliceStatus').style.color = '#dc3545';
            });

            socket.on('newMessage', (message) => {
                log('📩 NEW MESSAGE RECEIVED: ' + JSON.stringify(message), 'success');
            });

            socket.on('newConversation', (conversation) => {
                log('💬 NEW CONVERSATION: ' + JSON.stringify(conversation), 'success');
            });

            socket.on('userOnline', (userId) => {
                log('👋 User ' + userId + ' came online', 'info');
            });

            socket.on('userOffline', (userId) => {
                log('👋 User ' + userId + ' went offline', 'info');
            });
        }

        async function sendMessageAsCharlie() {
            try {
                // Login Charlie
                log('Logging in as Charlie...', 'info');
                const loginResponse = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'charlie_test',
                        password: 'password123'
                    })
                });

                const loginData = await loginResponse.json();
                if (!loginData.token) {
                    log('Charlie login failed: ' + JSON.stringify(loginData), 'error');
                    return;
                }

                log('Charlie logged in successfully', 'success');

                // Get Alice's ID (should be 5)
                const aliceId = 5;

                // Create conversation
                log('Creating conversation...', 'info');
                const convResponse = await fetch('http://localhost:5000/api/messages/conversations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + loginData.token
                    },
                    body: JSON.stringify({
                        otherUserId: aliceId
                    })
                });

                const convData = await convResponse.json();
                let conversationId;

                if (convData.id) {
                    conversationId = convData.id;
                    log('New conversation created: ' + conversationId, 'success');
                } else if (convData.conversationId) {
                    conversationId = convData.conversationId;
                    log('Using existing conversation: ' + conversationId, 'info');
                } else {
                    log('Failed to create conversation: ' + JSON.stringify(convData), 'error');
                    return;
                }

                // Send message
                log('Sending message...', 'info');
                const msgResponse = await fetch(`http://localhost:5000/api/messages/conversations/${conversationId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + loginData.token
                    },
                    body: JSON.stringify({
                        content: `Hi Alice! This is a test message from Charlie at ${new Date().toLocaleTimeString()}. You should see this in real-time!`
                    })
                });

                const msgData = await msgResponse.json();
                if (msgData.id) {
                    log('Message sent successfully: ' + msgData.content, 'success');
                } else {
                    log('Failed to send message: ' + JSON.stringify(msgData), 'error');
                }

            } catch (error) {
                log('Error sending message: ' + error.message, 'error');
            }
        }

        // Auto-clear log on page load
        clearLog();
        log('Test page loaded. Click "Login as Alice" first, then "Send Message from Charlie"', 'info');
    </script>
</body>
</html>
